services:
  - type: web
    name: ri-tetsuya-chat
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/mongodb/status
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: RiTetsuyaDb
